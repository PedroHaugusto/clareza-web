@if (usuario(); as logado) {
  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Ola, {{ logado.nome }}</h1>
    <p class="mt-2 text-slate-600">
      Sessao ativa como <span class="font-medium text-slate-900">{{ logado.email }}</span>.
    </p>
    <p class="mt-6 text-sm text-slate-500">
      A visao geral com saldo, resumo do mes e projecao entra no proximo bloco.
    </p>
  </div>
}
