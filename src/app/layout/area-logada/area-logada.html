<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-6">
        <p class="text-sm font-semibold uppercase tracking-widest text-emerald-600">Clareza</p>

        <nav class="flex items-center gap-4 text-sm">
          <a
            routerLink="/visao-geral"
            routerLinkActive="text-emerald-700 font-medium"
            class="text-slate-600 transition hover:text-slate-900"
          >
            Visao geral
          </a>
          <a
            routerLink="/lancamentos"
            routerLinkActive="text-emerald-700 font-medium"
            class="text-slate-600 transition hover:text-slate-900"
          >
            Lancamentos
          </a>
          <a
            routerLink="/calendario"
            routerLinkActive="text-emerald-700 font-medium"
            class="text-slate-600 transition hover:text-slate-900"
          >
            Calendario
          </a>
          <a
            routerLink="/cadastros"
            routerLinkActive="text-emerald-700 font-medium"
            class="text-slate-600 transition hover:text-slate-900"
          >
            Cadastros
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-4">
        @if (usuario(); as logado) {
          <span class="text-sm text-slate-600">{{ logado.nome }}</span>
        }
        <button
          type="button"
          (click)="sair()"
          class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Sair
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-8">
    <router-outlet />
  </main>
</div>
